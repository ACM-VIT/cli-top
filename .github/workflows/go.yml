# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
        
    - name: Install dependencies
      run: |
        go mod tidy
        go get .
        
    - name: Build
      run: go build -v ./...

    # - name: Test
      # run: go test -v ./...
  
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
        
    - name: Install dependencies
      run: |
        go mod tidy
        go get .
        
    - name: Build
      run: go build -v ./...

    # - name: Test
      # run: go test -v ./...

  build-mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
        
    - name: Install dependencies
      run: |
        go mod tidy
        go get .
        
    - name: Build
      run: go build -v ./...

    # - name: Test
      # run: go test -v ./...
