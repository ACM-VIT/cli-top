name: Build CLI-TOP Binary

on:
  push:
    branches:
      - main
      - release
  pull_request:
    types: [closed]
    branches:
      - main
      - release
  workflow_dispatch:

jobs:
  build-linux:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: |
          go mod tidy
          go get .

      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ./build/linux/ -v ./...
          chmod +x ./build/linux/cli-top

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-top-linux
          path: ./build/linux/cli-top

  build-windows:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: |
          go mod tidy
          go get .

      - name: Build Windows Executable
        run: |
          mkdir build\windows
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w" -o build\windows\cli-top.exe .

      - name: Install Inno Setup
        run: |
          Invoke-WebRequest -Uri https://jrsoftware.org/download.php/is.exe -OutFile is.exe
          Start-Process -FilePath is.exe -Args '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG="install.log"' -Wait
          Remove-Item is.exe -Force

      - name: Extract Version for Installer
        id: extract_version
        shell: pwsh
        run: |
          $line = Get-Content -Path './debug/debug.go' | Select-String -Pattern 'var Version string ='
          if ($line -match 'var Version string = "(.*)"') {
              $version = $matches[1]
              echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
              Write-Error "Version not found in debug.go"
              exit 1
          }

      - name: Create Inno Setup Script
        run: |
          $installerScript = @'
          [Setup]
          AppName=CLI-TOP
          AppVersion=${{ steps.extract_version.outputs.version }}
          DefaultDirName={localappdata}\CLI-TOP
          DefaultGroupName=CLI-TOP
          OutputBaseFilename=cli-top-installer-${{ steps.extract_version.outputs.version }}
          Compression=lzma
          SolidCompression=yes
          PrivilegesRequired=lowest

          [Files]
          Source: "build\windows\cli-top.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Code]
          function SplitString(const S: string; const Delimiter: char): TArrayOfString;
          var
            i, n, Count: Integer;
            part: String;
          begin
            Count := 1;
            for i := 1 to Length(S) do
              if S[i] = Delimiter then
                Inc(Count);
            SetArrayLength(Result, Count);
            n := 0;
            part := '';
            for i := 1 to Length(S) do
            begin
              if S[i] = Delimiter then
              begin
                Result[n] := part;
                part := '';
                Inc(n);
              end
              else
                part := part + S[i];
            end;
            Result[n] := part;
          end;

          function RemoveCliTopPaths(s: string): string;
          var
            i: integer;
            SplitPaths: TArrayOfString;
            CleanPaths: string;
          begin
            SplitPaths := SplitString(s, ';');
            CleanPaths := '';
            for i := 0 to GetArrayLength(SplitPaths)-1 do
            begin
              if (Pos('cli-top', LowerCase(SplitPaths[i])) = 0) and (Trim(SplitPaths[i]) <> '') then
              begin
                if CleanPaths <> '' then
                  CleanPaths := CleanPaths + ';';
                CleanPaths := CleanPaths + SplitPaths[i];
              end;
            end;
            Result := CleanPaths;
          end;

          const
            HWND_BROADCAST_CUSTOM = $FFFF; 
            WM_SETTINGCHANGE = $1A;

          function SendMessageTimeoutA(hwnd: LongWord; msg: LongWord; wParam: LongWord;
                                      lParam: PAnsiChar; flags: LongWord;
                                      uTimeout: LongWord; var lpdwResult: LongWord): LongWord;
            external 'SendMessageTimeoutA@user32.dll stdcall';

          procedure RefreshEnvironment;
          var
            ResultValue: LongWord;
            EnvironmentStr: AnsiString; 
          begin
            EnvironmentStr := 'Environment';
            if SendMessageTimeoutA(
                 HWND_BROADCAST_CUSTOM, WM_SETTINGCHANGE, 0, PAnsiChar(EnvironmentStr),
                 $2, 5000, ResultValue
               ) = 0 then
            begin
              MsgBox('Failed to refresh environment variables.', mbError, MB_OK);
            end;
          end;

          procedure UpdatePath;
          var
            Path: string;
            RegKey: string;
          begin
            RegKey := 'Environment';
            if not RegQueryStringValue(HKCU, RegKey, 'Path', Path) then
              Path := '';
            Path := RemoveCliTopPaths(Path);
            if Pos(ExpandConstant('{app}'), Path) = 0 then
            begin
              if Path <> '' then
                Path := Path + ';';
              Path := Path + ExpandConstant('{app}');
              if not RegWriteStringValue(HKCU, RegKey, 'Path', Path) then
                MsgBox('Failed to update PATH variable.', mbError, MB_OK);
            end;
            RefreshEnvironment;
          end;

          procedure CurStepChanged(CurStep: TSetupStep);
          begin
            if CurStep = ssPostInstall then
            begin
              UpdatePath;
              MsgBox('CLI-TOP has been installed successfully. Please open a new Command Prompt window to use the CLI-TOP command.',
                     mbInformation, MB_OK);
            end;
          end;
          '@
          Set-Content -Path installer.iss -Value $installerScript -Encoding UTF8NoBOM

      - name: Show Inno Setup Script (Debugging)
        shell: pwsh
        run: Get-Content installer.iss

      - name: Compile Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Verify Installer Generation
        shell: pwsh
        run: |
          if (!(Test-Path -Path "./Output/cli-top-installer-${{ steps.extract_version.outputs.version }}.exe")) {
              Write-Error "Installer file not found: ./Output/cli-top-installer-${{ steps.extract_version.outputs.version }}.exe"
              exit 1
          }

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: cli-top-windows
          path: ./build/windows/cli-top.exe

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: cli-top-windows-installer
          path: ./Output/cli-top-installer-${{ steps.extract_version.outputs.version }}.exe

  build-mac:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: |
          go mod tidy
          go get .

      - name: Build MacOS Binary
        run: |
          mkdir -p build/macos
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o build/macos/cli-top .
          chmod +x build/macos/cli-top

      - name: Upload MacOS Binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-top-macos
          path: ./build/macos/cli-top

  build-android:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: |
          go mod tidy
          go get .

      - name: Build Android Binary
        run: |
          mkdir -p build/android
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o build/android/cli-top .
          chmod +x build/android/cli-top

      - name: Upload Android Binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-top-android
          path: ./build/android/cli-top

  publish-website:
    name: Publish Website Release
    needs:
      - build-linux
      - build-windows
      - build-mac
      - build-android
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release')
    runs-on: ubuntu-latest
    env:
      WEBSITE_REPO: technical-director-acmvit/cli-top-website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure website token is configured
        run: |
          if [ -z "${{ secrets.WEBSITE_REPO_TOKEN }}" ]; then
            echo "::error ::Missing WEBSITE_REPO_TOKEN secret"
            exit 1
          fi

      - name: Extract version
        id: extract_version_publish
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/var Version string = "\(.*\)"/\1/p' debug/debug.go | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "::error ::Unable to determine version from debug/debug.go"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Load website release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          METADATA_FILE="release_metadata.json"
          if [ ! -f "$METADATA_FILE" ]; then
            echo "::error ::release_metadata.json not found"
            exit 1
          fi

          VERSION="${{ steps.extract_version_publish.outputs.version }}"
          FILE_VERSION=$(jq -r '.version // ""' "$METADATA_FILE")
          if [ -n "$FILE_VERSION" ] && [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "::error ::release_metadata.json version ($FILE_VERSION) does not match debug/debug.go ($VERSION)"
            exit 1
          fi

          jq -e '(.changes | type) == "array"' "$METADATA_FILE" > /dev/null

          RELEASE_DATE=$(jq -r '.releaseDate // ""' "$METADATA_FILE")
          if [ -z "$RELEASE_DATE" ]; then
            RELEASE_DATE=$(date -u +%Y-%m-%d)
          fi

          KILL_SWITCH=$(jq -r '.killSwitch // ""' "$METADATA_FILE")
          if [ -z "$KILL_SWITCH" ]; then
            KILL_SWITCH="4"
          fi
          if ! [[ "$KILL_SWITCH" =~ ^[0-9]+$ ]]; then
            echo "::error ::killSwitch must be numeric"
            exit 1
          fi

          RESOLVED_FILE="$GITHUB_WORKSPACE/.release_metadata_resolved.json"
          jq --arg rd "$RELEASE_DATE" --arg v "$VERSION" --arg ks "$KILL_SWITCH" '
            .releaseDate = $rd
            | .version = $v
            | .killSwitch = ($ks | tonumber)
          ' "$METADATA_FILE" > "$RESOLVED_FILE"

          echo "metadata_file=$RESOLVED_FILE" >> "$GITHUB_OUTPUT"

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: cli-top-linux
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: cli-top-windows
          path: artifacts/windows

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: cli-top-windows-installer
          path: artifacts/windows-installer

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: cli-top-macos
          path: artifacts/macos

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: cli-top-android
          path: artifacts/android

      - name: Prepare release packages
        run: |
          set -euo pipefail
          mkdir -p packaged

          LINUX_BIN=$(find artifacts/linux -type f -name 'cli-top' -print -quit)
          MAC_BIN=$(find artifacts/macos -type f -name 'cli-top' -print -quit)
          ANDROID_BIN=$(find artifacts/android -type f -name 'cli-top' -print -quit)
          WINDOWS_BIN=$(find artifacts/windows -type f -name 'cli-top.exe' -print -quit)
          INSTALLER_BIN=$(find artifacts/windows-installer -type f -name '*.exe' -print -quit)

          if [ -z "$LINUX_BIN" ] || [ -z "$MAC_BIN" ] || [ -z "$ANDROID_BIN" ] || [ -z "$WINDOWS_BIN" ] || [ -z "$INSTALLER_BIN" ]; then
            echo "::error ::One or more artifacts missing"
            exit 1
          fi

          zip -j packaged/cli-top-linux.zip "$LINUX_BIN"
          zip -j packaged/cli-top-macos.zip "$MAC_BIN"
          zip -j packaged/cli-top-android.zip "$ANDROID_BIN"
          zip -j packaged/cli-top-windows.zip "$WINDOWS_BIN"
          cp "$INSTALLER_BIN" packaged/cli-top-windows-installer.exe

      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WEBSITE_REPO }}
          path: website
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}

      - name: Sync website build files and metadata
        id: sync_website
        run: |
          set -euo pipefail
          VERSION="${{ steps.extract_version_publish.outputs.version }}"
          METADATA_FILE="${{ steps.release_metadata.outputs.metadata_file }}"
          RELEASE_DATE=$(jq -r '.releaseDate' "$METADATA_FILE")
          KILL_SWITCH=$(jq -r '.killSwitch' "$METADATA_FILE")
          CHANGES=$(jq -c '.changes' "$METADATA_FILE")

          TARGET_DIR="website/buildFiles/v${VERSION}"
          mkdir -p "$TARGET_DIR"
          cp packaged/cli-top-linux.zip "$TARGET_DIR/cli-top-linux_v${VERSION}.zip"
          cp packaged/cli-top-windows.zip "$TARGET_DIR/cli-top-windows_v${VERSION}.zip"
          cp packaged/cli-top-macos.zip "$TARGET_DIR/cli-top-macos_v${VERSION}.zip"
          cp packaged/cli-top-android.zip "$TARGET_DIR/cli-top-android_v${VERSION}.zip"
          cp packaged/cli-top-windows-installer.exe "$TARGET_DIR/cli-top-windows-installer_v${VERSION}.exe"

          cd website

          tmp=$(mktemp)
          jq --arg v "$VERSION" --arg ks "$KILL_SWITCH" '.version = $v | .killSwitch = ($ks | tonumber)' latest.json > "$tmp"
          mv "$tmp" latest.json

          jq -n --arg v "$VERSION" --arg rd "$RELEASE_DATE" --argjson changes "$CHANGES" '
            {
              version: $v,
              releaseDate: $rd,
              changes: $changes
            }
          ' > /tmp/release-entry.json
          tmp=$(mktemp)
          jq --slurpfile entry /tmp/release-entry.json '
            .releases |= ($entry + [ .releases[] | select(.version != $entry[0].version) ])
          ' releases.json > "$tmp"
          mv "$tmp" releases.json

      - name: Commit website changes
        id: commit_website
        env:
          VERSION: ${{ steps.extract_version_publish.outputs.version }}
        run: |
          set -euo pipefail
          cd website
          git config user.name "cli-top-bot"
          git config user.email "cli-top@users.noreply.github.com"
          BRANCH="auto/release-v${VERSION}"
          git checkout -B "$BRANCH"
          git add buildFiles latest.json releases.json
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Add CLI-TOP v${VERSION} assets"
          git push origin "$BRANCH"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open website pull request
        if: steps.commit_website.outputs.has_changes == 'true'
        env:
          VERSION: ${{ steps.extract_version_publish.outputs.version }}
          BRANCH: ${{ steps.commit_website.outputs.branch }}
          GH_TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          cd website
          PR_BODY="This PR adds the CLI-TOP v${VERSION} build artifacts and updates the release metadata.\n\n- Linux, Windows, macOS, and Android binaries\n- Windows installer\n- latest.json & releases.json entries\n"
          EXISTING=$(gh pr list --repo ${{ env.WEBSITE_REPO }} --head "$BRANCH" --json url --jq '.[0].url')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --repo ${{ env.WEBSITE_REPO }} --title "Release v${VERSION}" --body "$PR_BODY"
          else
            gh pr create --repo ${{ env.WEBSITE_REPO }} --head "$BRANCH" --title "Release v${VERSION}" --base main --body "$PR_BODY"
          fi
