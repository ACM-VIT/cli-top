# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: vtop-cli Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: |
          go mod tidy
          go get .

      - name: Build
        run: |
          go build -o ./build/linux/ -v ./...
          # mv ./build/linux/vtop-cli ./build/linux/vtop-cli.lin

      - name: Upload a Linux Binary
        uses: actions/upload-artifact@v3
        with:
          name: vtop-cli-linux
          path: ./build/linux/vtop-cli
          # name: vtop-cli
          # path: ./build/linux/vtop-cli.lin

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: |
          go mod tidy
          go get .

      - name: Build
        run: |
          go build -o ./build/windows/ -v ./...

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v3
        with:
          name: vtop-cli-windows
          # name: vtop-cli
          path: ./build/windows/vtop-cli.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: |
          go mod tidy
          go get .

      - name: Build
        run: |
          go build -o ./build/macos/ -v ./...
          # mv ./build/macos/vtop-cli ./build/macos/vtop-cli.mac

      - name: Upload MacOS Binary
        uses: actions/upload-artifact@v3
        with:
          name: vtop-cli-macos
          path: ./build/macos/vtop-cli
          # name: vtop-cli
          # path: ./build/macos/vtop-cli.mac
