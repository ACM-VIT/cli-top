name: Build CLI-TOP Binary

on:
  push:
    branches:
      - main
      - release
  pull_request:
    types: [closed]
    branches:
      - main
      - release
  workflow_dispatch:

jobs:
  build-linux:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: |
          go mod tidy
          go get .

      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ./build/linux/ -v ./...
          chmod +x ./build/linux/cli-top

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-top-linux
          path: ./build/linux/cli-top

  build-windows:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: |
          go mod tidy
          go get .

      - name: Build Windows Executable
        run: |
          mkdir build\windows
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w" -o build\windows\cli-top.exe .

      - name: Install Inno Setup
        run: |
          Invoke-WebRequest -Uri https://jrsoftware.org/download.php/is.exe -OutFile is.exe
          Start-Process -FilePath is.exe -Args '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG="install.log"' -Wait
          Remove-Item is.exe -Force

      - name: Extract Version for Installer
        id: extract_version
        shell: pwsh
        run: |
          $line = Get-Content -Path './debug/debug.go' | Select-String -Pattern 'var Version string ='
          if ($line -match 'var Version string = "(.*)"') {
              $version = $matches[1]
              echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
              Write-Error "Version not found in debug.go"
              exit 1
          }

      - name: Create Inno Setup Script
        run: |
          $installerScript = @'
          [Setup]
          AppName=CLI-TOP
          AppVersion=${{ steps.extract_version.outputs.version }}
          DefaultDirName={localappdata}\CLI-TOP
          DefaultGroupName=CLI-TOP
          OutputBaseFilename=cli-top-installer-${{ steps.extract_version.outputs.version }}
          Compression=lzma
          SolidCompression=yes
          PrivilegesRequired=lowest

          [Files]
          Source: "build\windows\cli-top.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Code]
          function SplitString(const S: string; const Delimiter: char): TArrayOfString;
          var
            i, n, Count: Integer;
            part: String;
          begin
            Count := 1;
            for i := 1 to Length(S) do
              if S[i] = Delimiter then
                Inc(Count);
            SetArrayLength(Result, Count);
            n := 0;
            part := '';
            for i := 1 to Length(S) do
            begin
              if S[i] = Delimiter then
              begin
                Result[n] := part;
                part := '';
                Inc(n);
              end
              else
                part := part + S[i];
            end;
            Result[n] := part;
          end;

          function RemoveCliTopPaths(s: string): string;
          var
            i: integer;
            SplitPaths: TArrayOfString;
            CleanPaths: string;
          begin
            SplitPaths := SplitString(s, ';');
            CleanPaths := '';
            for i := 0 to GetArrayLength(SplitPaths)-1 do
            begin
              if (Pos('cli-top', LowerCase(SplitPaths[i])) = 0) and (Trim(SplitPaths[i]) <> '') then
              begin
                if CleanPaths <> '' then
                  CleanPaths := CleanPaths + ';';
                CleanPaths := CleanPaths + SplitPaths[i];
              end;
            end;
            Result := CleanPaths;
          end;

          const
            HWND_BROADCAST_CUSTOM = $FFFF; 
            WM_SETTINGCHANGE = $1A;

          function SendMessageTimeoutA(hwnd: LongWord; msg: LongWord; wParam: LongWord;
                                      lParam: PAnsiChar; flags: LongWord;
                                      uTimeout: LongWord; var lpdwResult: LongWord): LongWord;
            external 'SendMessageTimeoutA@user32.dll stdcall';

          procedure RefreshEnvironment;
          var
            ResultValue: LongWord;
            EnvironmentStr: AnsiString; 
          begin
            EnvironmentStr := 'Environment';
            if SendMessageTimeoutA(
                 HWND_BROADCAST_CUSTOM, WM_SETTINGCHANGE, 0, PAnsiChar(EnvironmentStr),
                 $2, 5000, ResultValue
               ) = 0 then
            begin
              MsgBox('Failed to refresh environment variables.', mbError, MB_OK);
            end;
          end;

          procedure UpdatePath;
          var
            Path: string;
            RegKey: string;
          begin
            RegKey := 'Environment';
            if not RegQueryStringValue(HKCU, RegKey, 'Path', Path) then
              Path := '';
            Path := RemoveCliTopPaths(Path);
            if Pos(ExpandConstant('{app}'), Path) = 0 then
            begin
              if Path <> '' then
                Path := Path + ';';
              Path := Path + ExpandConstant('{app}');
              if not RegWriteStringValue(HKCU, RegKey, 'Path', Path) then
                MsgBox('Failed to update PATH variable.', mbError, MB_OK);
            end;
            RefreshEnvironment;
          end;

          procedure CurStepChanged(CurStep: TSetupStep);
          begin
            if CurStep = ssPostInstall then
            begin
              UpdatePath;
              MsgBox('CLI-TOP has been installed successfully. Please open a new Command Prompt window to use the CLI-TOP command.',
                     mbInformation, MB_OK);
            end;
          end;
          '@
          Set-Content -Path installer.iss -Value $installerScript -Encoding UTF8NoBOM

      - name: Show Inno Setup Script (Debugging)
        shell: pwsh
        run: Get-Content installer.iss

      - name: Compile Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Verify Installer Generation
        shell: pwsh
        run: |
          if (!(Test-Path -Path "./Output/cli-top-installer-${{ steps.extract_version.outputs.version }}.exe")) {
              Write-Error "Installer file not found: ./Output/cli-top-installer-${{ steps.extract_version.outputs.version }}.exe"
              exit 1
          }

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: cli-top-windows
          path: ./build/windows/cli-top.exe

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: cli-top-windows-installer
          path: ./Output/cli-top-installer-${{ steps.extract_version.outputs.version }}.exe

  build-mac:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev')
    runs-on: macos-latest
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
      MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY }}
      MACOS_PKG_IDENTIFIER: ${{ vars.MACOS_PKG_IDENTIFIER }}
      MACOS_INSTALL_LOCATION: ${{ vars.MACOS_INSTALL_LOCATION }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: |
          go mod tidy
          go get .

      - name: Extract version
        id: extract_version_macos
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/var Version string = "\(.*\)"/\1/p' debug/debug.go | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "::error ::Unable to determine version from debug/debug.go"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify signing inputs
        run: |
          set -euo pipefail
          REQUIRED_VARS=(
            APPLE_SIGNING_IDENTITY
            APPLE_INSTALLER_IDENTITY
            MACOS_CERT_P12
            MACOS_CERT_PASSWORD
            MACOS_INSTALLER_CERT_P12
            MACOS_INSTALLER_CERT_PASSWORD
            APPLE_NOTARY_KEY_ID
            APPLE_NOTARY_ISSUER_ID
            APPLE_NOTARY_API_KEY
            MACOS_PKG_IDENTIFIER
          )
          for VAR in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!VAR:-}" ]; then
              echo "::error ::Missing required value: ${VAR}"
              exit 1
            fi
          done
          if [ -z "${MACOS_INSTALL_LOCATION:-}" ]; then
            echo "MACOS_INSTALL_LOCATION=/usr/local/bin" >> "$GITHUB_ENV"
          fi

      - name: Import signing certificates
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN_PATH="$RUNNER_TEMP/build-signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 21600 -u "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          APP_CERT_PATH="$RUNNER_TEMP/app_cert.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/installer_cert.p12"
          clean_b64() {
            local value="$1"
            local prefix="$2"
            printf "%s" "$value" | tr -d '\r\n' | sed "s/^${prefix}=//"
          }
          clean_b64 "$MACOS_CERT_P12" "MACOS_CERT_P12" | base64 --decode > "$APP_CERT_PATH"
          clean_b64 "$MACOS_INSTALLER_CERT_P12" "MACOS_INSTALLER_CERT_P12" | base64 --decode > "$INSTALLER_CERT_PATH"
          if [ ! -s "$APP_CERT_PATH" ] || [ ! -s "$INSTALLER_CERT_PATH" ]; then
            echo "::error ::Decoded P12 file is empty. Check that the secrets contain only the base64 value."
            exit 1
          fi
          openssl pkcs12 -in "$APP_CERT_PATH" -passin pass:"$MACOS_CERT_PASSWORD" -noout >/dev/null
          openssl pkcs12 -in "$INSTALLER_CERT_PATH" -passin pass:"$MACOS_INSTALLER_CERT_PASSWORD" -noout >/dev/null

          security import "$APP_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security import "$INSTALLER_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_INSTALLER_CERT_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/productsign -T /usr/bin/pkgbuild -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build MacOS Universal Binary
        run: |
          set -euo pipefail
          mkdir -p build/macos/amd64 build/macos/arm64
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o build/macos/amd64/cli-top .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o build/macos/arm64/cli-top .
          lipo -create -output build/macos/cli-top build/macos/amd64/cli-top build/macos/arm64/cli-top
          chmod +x build/macos/cli-top

      - name: Codesign binary
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" build/macos/cli-top
          codesign --verify --verbose=2 build/macos/cli-top

      - name: Package signed ZIP (legacy)
        run: |
          set -euo pipefail
          zip -j build/macos/cli-top-macos.zip build/macos/cli-top

      - name: Build unsigned PKG
        run: |
          set -euo pipefail
          VERSION="${{ steps.extract_version_macos.outputs.version }}"
          mkdir -p build/macos/pkgroot
          cp build/macos/cli-top build/macos/pkgroot/cli-top
          pkgbuild --root build/macos/pkgroot \
            --install-location "${MACOS_INSTALL_LOCATION}" \
            --identifier "${MACOS_PKG_IDENTIFIER}" \
            --version "${VERSION}" \
            build/macos/cli-top-unsigned.pkg

      - name: Create installer resources
        run: |
          set -euo pipefail
          VERSION="${{ steps.extract_version_macos.outputs.version }}"
          RES_DIR="build/macos/installer-resources"
          mkdir -p "$RES_DIR"
          python3 - <<'PY'
          import html
          import os
          import pathlib
          
          raw_logo = pathlib.Path("logo.txt").read_text()
          lines = [line.rstrip() for line in raw_logo.splitlines()]
          logo = "\n".join(lines)
          logo_html = (
              '<pre style="font-family: Menlo, monospace; font-size: 12px; line-height: 1.1; margin: 0 0 12px 0;">\n'
              + html.escape(logo)
              + "\n</pre>"
          )
          
          install_location = os.environ.get("MACOS_INSTALL_LOCATION", "/usr/local/bin")
          version = os.environ.get("VERSION", "")
          
          welcome = f"""<!doctype html>
          <html>
          <head><meta charset="utf-8"></head>
          <body style="font-family: -apple-system, Helvetica, Arial, sans-serif; padding: 16px;">
            {logo_html}
            <p><strong>CLI-TOP</strong> will be installed to <code>{html.escape(install_location)}</code>.</p>
            <p>You may be prompted for your password during installation.</p>
          </body>
          </html>
          """
          
          conclusion = f"""<!doctype html>
          <html>
          <head><meta charset="utf-8"></head>
          <body style="font-family: -apple-system, Helvetica, Arial, sans-serif; padding: 16px;">
            {logo_html}
            <p><strong>CLI-TOP {html.escape(version)}</strong> is installed.</p>
            <p>Open a new Terminal and run <code>cli-top</code>.</p>
          </body>
          </html>
          """
          
          res_dir = pathlib.Path("build/macos/installer-resources")
          res_dir.joinpath("Welcome.html").write_text(welcome)
          res_dir.joinpath("Conclusion.html").write_text(conclusion)
          PY
        env:
          VERSION: ${{ steps.extract_version_macos.outputs.version }}

      - name: Build signed PKG
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          if ! security find-identity -v "$KEYCHAIN_PATH" | grep -q "Developer ID Installer"; then
            echo "::error ::No Developer ID Installer identity found in keychain."
            security find-identity -v "$KEYCHAIN_PATH" || true
            exit 1
          fi
          VERSION="${{ steps.extract_version_macos.outputs.version }}"
          cat > build/macos/Distribution.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="1">
            <title>CLI-TOP</title>
            <options customize="never" require-scripts="false" hostArchitectures="x86_64,arm64"/>
            <welcome file="Welcome.html"/>
            <conclusion file="Conclusion.html"/>
            <choices-outline>
              <line choice="default">
                <line choice="cli-top"/>
              </line>
            </choices-outline>
            <choice id="default"/>
            <choice id="cli-top" visible="false">
              <pkg-ref id="${MACOS_PKG_IDENTIFIER}"/>
            </choice>
            <pkg-ref id="${MACOS_PKG_IDENTIFIER}" version="${VERSION}">cli-top-unsigned.pkg</pkg-ref>
          </installer-gui-script>
          EOF
          productbuild --sign "${APPLE_INSTALLER_IDENTITY}" \
            --keychain "$KEYCHAIN_PATH" \
            --distribution build/macos/Distribution.xml \
            --resources build/macos/installer-resources \
            --package-path build/macos \
            build/macos/cli-top.pkg

      - name: Notarize PKG
        run: |
          set -euo pipefail
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf "%s" "$APPLE_NOTARY_API_KEY" | base64 -D > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"
          xcrun notarytool submit build/macos/cli-top.pkg \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait

      - name: Staple PKG
        run: |
          set -euo pipefail
          xcrun stapler staple build/macos/cli-top.pkg
          spctl -a -vv --type install build/macos/cli-top.pkg

      - name: Upload MacOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cli-top-macos
          path: ./build/macos/cli-top-macos.zip

      - name: Upload MacOS PKG
        uses: actions/upload-artifact@v4
        with:
          name: cli-top-macos-pkg
          path: ./build/macos/cli-top.pkg

  build-android:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: |
          go mod tidy
          go get .

      - name: Build Android Binary
        run: |
          mkdir -p build/android
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o build/android/cli-top .
          chmod +x build/android/cli-top

      - name: Upload Android Binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-top-android
          path: ./build/android/cli-top

  publish-website:
    name: Publish Website Release
    needs:
      - build-linux
      - build-windows
      - build-mac
      - build-android
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release')
    runs-on: ubuntu-latest
    env:
      WEBSITE_REPO: technical-director-acmvit/cli-top-website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure website token is configured
        run: |
          if [ -z "${{ secrets.WEBSITE_REPO_TOKEN }}" ]; then
            echo "::error ::Missing WEBSITE_REPO_TOKEN secret"
            exit 1
          fi

      - name: Extract version
        id: extract_version_publish
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/var Version string = "\(.*\)"/\1/p' debug/debug.go | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "::error ::Unable to determine version from debug/debug.go"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Load website release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          METADATA_FILE="release_metadata.json"
          if [ ! -f "$METADATA_FILE" ]; then
            echo "::error ::release_metadata.json not found"
            exit 1
          fi

          VERSION="${{ steps.extract_version_publish.outputs.version }}"
          FILE_VERSION=$(jq -r '.version // ""' "$METADATA_FILE")
          if [ -n "$FILE_VERSION" ] && [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "::error ::release_metadata.json version ($FILE_VERSION) does not match debug/debug.go ($VERSION)"
            exit 1
          fi

          jq -e '(.changes | type) == "array"' "$METADATA_FILE" > /dev/null

          RELEASE_DATE=$(jq -r '.releaseDate // ""' "$METADATA_FILE")
          if [ -z "$RELEASE_DATE" ]; then
            RELEASE_DATE=$(date -u +%Y-%m-%d)
          fi

          KILL_SWITCH=$(jq -r '.killSwitch // ""' "$METADATA_FILE")
          if [ -z "$KILL_SWITCH" ]; then
            KILL_SWITCH="4"
          fi
          if ! [[ "$KILL_SWITCH" =~ ^[0-9]+$ ]]; then
            echo "::error ::killSwitch must be numeric"
            exit 1
          fi

          RESOLVED_FILE="$GITHUB_WORKSPACE/.release_metadata_resolved.json"
          jq --arg rd "$RELEASE_DATE" --arg v "$VERSION" --arg ks "$KILL_SWITCH" '
            .releaseDate = $rd
            | .version = $v
            | .killSwitch = ($ks | tonumber)
          ' "$METADATA_FILE" > "$RESOLVED_FILE"

          echo "metadata_file=$RESOLVED_FILE" >> "$GITHUB_OUTPUT"

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: cli-top-linux
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: cli-top-windows
          path: artifacts/windows

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: cli-top-windows-installer
          path: artifacts/windows-installer

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: cli-top-macos
          path: artifacts/macos

      - name: Download macOS pkg artifact
        uses: actions/download-artifact@v4
        with:
          name: cli-top-macos-pkg
          path: artifacts/macos-pkg

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: cli-top-android
          path: artifacts/android

      - name: Prepare release packages
        run: |
          set -euo pipefail
          mkdir -p packaged

          LINUX_BIN=$(find artifacts/linux -type f -name 'cli-top' -print -quit)
          MAC_ZIP=$(find artifacts/macos -type f -name '*.zip' -print -quit)
          MAC_PKG=$(find artifacts/macos-pkg -type f -name '*.pkg' -print -quit)
          ANDROID_BIN=$(find artifacts/android -type f -name 'cli-top' -print -quit)
          WINDOWS_BIN=$(find artifacts/windows -type f -name 'cli-top.exe' -print -quit)
          INSTALLER_BIN=$(find artifacts/windows-installer -type f -name '*.exe' -print -quit)

          if [ -z "$LINUX_BIN" ] || [ -z "$MAC_ZIP" ] || [ -z "$MAC_PKG" ] || [ -z "$ANDROID_BIN" ] || [ -z "$WINDOWS_BIN" ] || [ -z "$INSTALLER_BIN" ]; then
            echo "::error ::One or more artifacts missing"
            exit 1
          fi

          zip -j packaged/cli-top-linux.zip "$LINUX_BIN"
          cp "$MAC_ZIP" packaged/cli-top-macos.zip
          cp "$MAC_PKG" packaged/cli-top-macos.pkg
          zip -j packaged/cli-top-android.zip "$ANDROID_BIN"
          zip -j packaged/cli-top-windows.zip "$WINDOWS_BIN"
          cp "$INSTALLER_BIN" packaged/cli-top-windows-installer.exe

      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WEBSITE_REPO }}
          path: website
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}

      - name: Sync website build files and metadata
        id: sync_website
        run: |
          set -euo pipefail
          VERSION="${{ steps.extract_version_publish.outputs.version }}"
          METADATA_FILE="${{ steps.release_metadata.outputs.metadata_file }}"
          RELEASE_DATE=$(jq -r '.releaseDate' "$METADATA_FILE")
          KILL_SWITCH=$(jq -r '.killSwitch' "$METADATA_FILE")
          CHANGES=$(jq -c '.changes' "$METADATA_FILE")

          TARGET_DIR="website/buildFiles/v${VERSION}"
          mkdir -p "$TARGET_DIR"
          cp packaged/cli-top-linux.zip "$TARGET_DIR/cli-top-linux_v${VERSION}.zip"
          cp packaged/cli-top-windows.zip "$TARGET_DIR/cli-top-windows_v${VERSION}.zip"
          cp packaged/cli-top-macos.zip "$TARGET_DIR/cli-top-macos_v${VERSION}.zip"
          cp packaged/cli-top-macos.pkg "$TARGET_DIR/cli-top-macos_v${VERSION}.pkg"
          cp packaged/cli-top-android.zip "$TARGET_DIR/cli-top-android_v${VERSION}.zip"
          cp packaged/cli-top-windows-installer.exe "$TARGET_DIR/cli-top-windows-installer_v${VERSION}.exe"

          cd website

          tmp=$(mktemp)
          jq --arg v "$VERSION" --arg ks "$KILL_SWITCH" '.version = $v | .killSwitch = ($ks | tonumber)' latest.json > "$tmp"
          mv "$tmp" latest.json

          jq -n --arg v "$VERSION" --arg rd "$RELEASE_DATE" --argjson changes "$CHANGES" '
            {
              version: $v,
              releaseDate: $rd,
              changes: $changes
            }
          ' > /tmp/release-entry.json
          tmp=$(mktemp)
          jq --slurpfile entry /tmp/release-entry.json '
            if type == "object" and has("releases") then
              .releases = ($entry + [ .releases[] | select(.version != $entry[0].version) ])
            elif type == "array" then
              { releases: ($entry + [ .[] | select(.version != $entry[0].version) ]) }
            else
              { releases: $entry }
            end
          ' releases.json > "$tmp"
          mv "$tmp" releases.json

      - name: Commit website changes
        id: commit_website
        env:
          VERSION: ${{ steps.extract_version_publish.outputs.version }}
        run: |
          set -euo pipefail
          cd website
          git config user.name "cli-top-bot"
          git config user.email "cli-top@users.noreply.github.com"
          BRANCH="auto/release-v${VERSION}"
          git checkout -B "$BRANCH"
          git add buildFiles latest.json releases.json
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Add CLI-TOP v${VERSION} assets"
          git push origin "$BRANCH"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open website pull request
        if: steps.commit_website.outputs.has_changes == 'true'
        env:
          VERSION: ${{ steps.extract_version_publish.outputs.version }}
          BRANCH: ${{ steps.commit_website.outputs.branch }}
          GH_TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
          WEBSITE_REPO: ${{ env.WEBSITE_REPO }}
          METADATA_FILE: ${{ steps.release_metadata.outputs.metadata_file }}
        run: |
          set -euo pipefail
          cd website

          RELEASE_NOTES=""
          if [ -f "$METADATA_FILE" ]; then
            RELEASE_NOTES=$(jq -r '.changes | map("- " + .) | join("\n")' "$METADATA_FILE")
          fi
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="- (no release notes provided)"
          fi

          ASSETS="- Linux, Windows, macOS (zip + pkg), and Android binaries\n- Windows installer\n- latest.json & releases.json entries"

          PR_BODY=$(printf "This PR adds the CLI-TOP v%s build artifacts and refreshes the public release metadata.\n\n## Release Notes\n%s\n\n## Updated Assets\n%s\n" "$VERSION" "$RELEASE_NOTES" "$ASSETS")

          EXISTING=$(gh pr list --repo "$WEBSITE_REPO" --head "$BRANCH" --json url --jq '.[0].url')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --repo "$WEBSITE_REPO" --title "Release v${VERSION}" --body "$PR_BODY"
          else
            gh pr create --repo "$WEBSITE_REPO" --head "$BRANCH" --title "Release v${VERSION}" --base main --body "$PR_BODY"
          fi
