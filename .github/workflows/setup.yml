name: Build and Deploy cli-top Binaries

on:
  push:
    branches: ["main", "release"]
  pull_request:
    branches: ["main", "release"]

env:
  TARGET_REPO: technical-director-acmvit/cli-top-website
  VERSION_DIR_PREFIX: v

jobs:
  setup-fork:
    name: Setup User Fork
    runs-on: ubuntu-latest
    outputs:
      fork_exists: ${{ steps.check_fork.outputs.exists }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Variables
        id: vars
        run: |
          echo "USERNAME=${GITHUB_ACTOR}" >> $GITHUB_ENV
          echo "FORK_REPO=${GITHUB_ACTOR}/cli-top-website" >> $GITHUB_ENV

      - name: Check if Fork Exists
        id: check_fork
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://api.github.com/repos/${{ env.FORK_REPO }})
          if [ "$RESPONSE" -eq 200 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Fork if Not Exists
        if: steps.check_fork.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_PAT: ${{ secrets['FORK_PAT_' + github.actor] }}
        run: |
          if [ -z "${USER_PAT}" ]; then
            echo "User PAT not found. Please add a secret named FORK_PAT_${GITHUB_ACTOR} with a personal access token."
            exit 1
          fi

          # Authenticate with user's PAT
          echo "${USER_PAT}" > user_pat.txt
          chmod 600 user_pat.txt

          # Use GitHub CLI to create fork
          gh auth login --with-token < user_pat.txt
          gh repo fork technical-director-acmvit/cli-top-website --clone=false

      - name: Wait for Fork to be Available
        if: steps.check_fork.outputs.exists == 'false'
        run: |
          echo "Waiting for fork to be created..."
          for i in {1..10}; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://api.github.com/repos/${{ env.FORK_REPO }})
            if [ "$RESPONSE" -eq 200 ]; then
              echo "Fork created successfully."
              exit 0
            fi
            sleep 5
          done
          echo "Fork was not created in expected time."
          exit 1

  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    needs: setup-fork
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build Linux Binary
        run: |
          mkdir -p build/linux
          go build -o build/linux/cli-top .

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-linux
          path: ./build/linux/cli-top

      - name: Extract Version
        id: extract_version
        run: |
          VERSION=$(grep 'var Version string =' ./debug/debug.go | awk -F '"' '{print $2}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  build-windows:
    name: Build Windows Executable and Installer
    runs-on: windows-latest
    needs: setup-fork
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build Windows Executable
        run: |
          mkdir build\windows
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o build\windows\cli-top.exe .

      - name: Install Inno Setup
        run: |
          Invoke-WebRequest -Uri https://jrsoftware.org/download.php/is.exe -OutFile is.exe
          Start-Process -FilePath is.exe -Args '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG="install.log"' -Wait
          Remove-Item is.exe -Force

      - name: Extract Version for Installer
        id: extract_version
        shell: pwsh
        run: |
          $line = Get-Content -Path './debug/debug.go' | Select-String -Pattern 'var Version string ='
          if ($line -match 'var Version string = "(.*)"') {
              $version = $matches[1]
              echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
              Write-Error "Version not found in debug.go"
              exit 1
          }

      - name: Create Inno Setup Script
        run: |
          $installerScript = @'
          [Setup]
          AppName=CLI-TOP
          AppVersion=${{ steps.extract_version.outputs.version }}
          DefaultDirName={localappdata}\CLI-TOP
          DefaultGroupName=CLI-TOP
          OutputBaseFilename=cli-top-installer-${{ steps.extract_version.outputs.version }}
          Compression=lzma
          SolidCompression=yes
          PrivilegesRequired=lowest

          [Files]
          Source: "build/windows/cli-top.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Code]
          function SplitString(const S: string; const Delimiter: char): TArrayOfString;
          var
            i, n, Count: Integer;
            part: String;
          begin
            Count := 1;
            for i := 1 to Length(S) do
              if S[i] = Delimiter then
                Inc(Count);
            SetArrayLength(Result, Count);
            n := 0;
            part := '';
            for i := 1 to Length(S) do
            begin
              if S[i] = Delimiter then
              begin
                Result[n] := part;
                part := '';
                Inc(n);
              end
              else
                part := part + S[i];
            end;
            Result[n] := part;
          end;

          function RemoveCliTopPaths(s: string): string;
          var
            i: integer;
            SplitPaths: TArrayOfString;
            CleanPaths: string;
          begin
            SplitPaths := SplitString(s, ';');
            CleanPaths := '';
            for i := 0 to GetArrayLength(SplitPaths)-1 do
            begin
              if (Pos('cli-top', LowerCase(SplitPaths[i])) = 0) and (Trim(SplitPaths[i]) <> '') then
              begin
                if CleanPaths <> '' then
                  CleanPaths := CleanPaths + ';';
                CleanPaths := CleanPaths + SplitPaths[i];
              end;
            end;
            Result := CleanPaths;
          end;

          const
            HWND_BROADCAST_CUSTOM = $FFFF; 
            WM_SETTINGCHANGE = $1A;

          function SendMessageTimeoutA(hwnd: LongWord; msg: LongWord; wParam: LongWord;
                                      lParam: PAnsiChar; flags: LongWord;
                                      uTimeout: LongWord; var lpdwResult: LongWord): LongWord;
            external 'SendMessageTimeoutA@user32.dll stdcall';

          procedure RefreshEnvironment;
          var
            ResultValue: LongWord;
            EnvironmentStr: AnsiString; 
          begin
            EnvironmentStr := 'Environment';
            if SendMessageTimeoutA(
                 HWND_BROADCAST_CUSTOM, WM_SETTINGCHANGE, 0, PAnsiChar(EnvironmentStr),
                 $2, 5000, ResultValue
               ) = 0 then
            begin
              MsgBox('Failed to refresh environment variables.', mbError, MB_OK);
            end;
          end;

          procedure UpdatePath;
          var
            Path: string;
            RegKey: string;
          begin
            RegKey := 'Environment';

            if not RegQueryStringValue(HKCU, RegKey, 'Path', Path) then
              Path := '';

            // Remove any old cli-top references
            Path := RemoveCliTopPaths(Path);

            // Now add the new cli-top path
            if Pos(ExpandConstant('{app}'), Path) = 0 then
            begin
              if Path <> '' then
                Path := Path + ';';
              Path := Path + ExpandConstant('{app}');

              if not RegWriteStringValue(HKCU, RegKey, 'Path', Path) then
                MsgBox('Failed to update PATH variable.', mbError, MB_OK);
            end;

            RefreshEnvironment;
          end;

          procedure CurStepChanged(CurStep: TSetupStep);
          begin
            if CurStep = ssPostInstall then
            begin
              UpdatePath;
              MsgBox('CLI-TOP has been installed successfully. Please open a new Command Prompt window to use the CLI-TOP command.',
                     mbInformation, MB_OK);
            end;
          end;
          '@

          Set-Content -Path installer.iss -Value $installerScript -Encoding UTF8NoBOM

      - name: Show Inno Setup Script (Debugging)
        shell: pwsh
        run: Get-Content installer.iss

      - name: Compile Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Verify Installer Generation
        shell: pwsh
        run: |
          if (!(Test-Path -Path "./Output/cli-top-installer-${{ steps.extract_version.outputs.version }}.exe")) {
              Write-Error "Installer file not found: ./Output/cli-top-installer-${{ steps.extract_version.outputs.version }}.exe"
              exit 1
          }

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-windows
          path: ./build/windows/cli-top.exe

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-windows-installer
          path: ./Output/cli-top-installer-${{ steps.extract_version.outputs.version }}.exe

  build-macos:
    name: Build MacOS Binary
    runs-on: macos-latest
    needs: setup-fork
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build MacOS Binary
        run: |
          mkdir -p build/macos
          GOOS=darwin GOARCH=amd64 go build -o build/macos/cli-top .
          chmod +x build/macos/cli-top

      - name: Upload MacOS Binary
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-macos
          path: ./build/macos/cli-top

  build-android:
    name: Build Android Binary
    runs-on: ubuntu-latest
    needs: setup-fork
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build Android Binary
        run: |
          mkdir -p build/android
          GOOS=linux GOARCH=arm64 go build -o build/android/cli-top .
          chmod +x build/android/cli-top

      - name: Upload Android Binary
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-android
          path: ./build/android/cli-top

  deploy:
    name: Deploy Binaries and Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos, build-android]
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v3
        with:
          repository: ${{ env.FORK_REPO }}
          token: ${{ secrets['FORK_PAT_' + github.actor] }}
          ref: main

      - name: Extract Version from Build
        id: extract_version
        run: |
          echo "version=${{ needs.build-linux.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Create Version Directory
        run: |
          VERSION_DIR="${{ env.VERSION_DIR_PREFIX }}${{ steps.extract_version.outputs.version }}"
          mkdir -p "buildFiles/${VERSION_DIR}"

      - name: Download Linux Binary
        uses: actions/download-artifact@v3
        with:
          name: cli-top-linux
          path: ./linux

      - name: Download Windows Executable
        uses: actions/download-artifact@v3
        with:
          name: cli-top-windows
          path: ./windows

      - name: Download Windows Installer
        uses: actions/download-artifact@v3
        with:
          name: cli-top-windows-installer
          path: ./windows

      - name: Download MacOS Binary
        uses: actions/download-artifact@v3
        with:
          name: cli-top-macos
          path: ./macos

      - name: Download Android Binary
        uses: actions/download-artifact@v3
        with:
          name: cli-top-android
          path: ./android

      - name: Zip and Rename Artifacts (Except Installer)
        run: |
          VERSION=${{ steps.extract_version.outputs.version }}
          # Linux
          mv linux/cli-top linux/cli-top-linux_v${VERSION}
          zip linux/cli-top-linux_v${VERSION}.zip linux/cli-top-linux_v${VERSION}
          rm linux/cli-top-linux_v${VERSION}

          # Windows Executable
          mv windows/cli-top.exe windows/cli-top-windows_v${VERSION}.exe
          zip windows/cli-top-windows_v${VERSION}.zip windows/cli-top-windows_v${VERSION}.exe
          rm windows/cli-top-windows_v${VERSION}.exe

          # Windows Installer (no compression)
          mv windows/cli-top-installer-${VERSION}.exe windows/cli-top-windows-installer_v${VERSION}.exe

          # MacOS
          mv macos/cli-top macos/cli-top-macos_v${VERSION}
          zip macos/cli-top-macos_v${VERSION}.zip macos/cli-top-macos_v${VERSION}
          rm macos/cli-top-macos_v${VERSION}

          # Android
          mv android/cli-top android/cli-top-android_v${VERSION}
          zip android/cli-top-android_v${VERSION}.zip android/cli-top-android_v${VERSION}
          rm android/cli-top-android_v${VERSION}

      - name: Move Artifacts
        run: |
          VERSION=${{ steps.extract_version.outputs.version }}
          VERSION_DIR="${{ env.VERSION_DIR_PREFIX }}${VERSION}"
          mv linux/cli-top-linux_v${VERSION}.zip "buildFiles/${VERSION_DIR}/"
          mv windows/cli-top-windows_v${VERSION}.zip "buildFiles/${VERSION_DIR}/"
          # Move the uncompressed Windows Installer
          mv windows/cli-top-windows-installer_v${VERSION}.exe "buildFiles/${VERSION_DIR}/"
          mv macos/cli-top-macos_v${VERSION}.zip "buildFiles/${VERSION_DIR}/"
          mv android/cli-top-android_v${VERSION}.zip "buildFiles/${VERSION_DIR}/"

      - name: Update latest.json
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          LATEST_JSON="latest.json"
          if [ -f "$LATEST_JSON" ]; then
            jq --arg v "${{ steps.extract_version.outputs.version }}" '.version = $v' "$LATEST_JSON" > tmp.json && mv tmp.json "$LATEST_JSON"
          else
            echo "latest.json not found!"
            exit 1
          fi

      - name: Define Branch Name
        id: define_branch
        run: echo "branch=add-binaries-v${{ steps.extract_version.outputs.version }}-${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ${{ steps.define_branch.outputs.branch }}
          git add .
          git commit -m "Add binaries and update latest.json for version v${{ steps.extract_version.outputs.version }}" || echo "No changes to commit"
          git push origin ${{ steps.define_branch.outputs.branch }}

      - name: Authenticate GH CLI
        run: |
          echo "${{ secrets['FORK_PAT_' + github.actor] }}" | gh auth login --with-token

      - name: Create Pull Request via GH CLI
        run: |
          VERSION=${{ steps.extract_version.outputs.version }}
          gh pr create \
            --repo ${{ env.TARGET_REPO }} \
            --base main \
            --head ${{ github.actor }}:${{ steps.define_branch.outputs.branch }} \
            --title "Add binaries and update latest.json for version v${VERSION}" \
            --body "This PR adds the binaries (zipped), the Windows installer (uncompressed), and updates the latest.json file for version v${VERSION}."

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets['FORK_PAT_' + github.actor] }}
        with:
          tag_name: "v${{ steps.extract_version.outputs.version }}"
          release_name: "Release v${{ steps.extract_version.outputs.version }}"
          draft: false
          prerelease: false

      - name: Upload Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets['FORK_PAT_' + github.actor] }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./buildFiles/v${{ steps.extract_version.outputs.version }}/cli-top-linux_v${{ steps.extract_version.outputs.version }}.zip
          asset_name: cli-top-linux_v${{ steps.extract_version.outputs.version }}.zip
          asset_content_type: application/zip

      - name: Upload Windows Executable to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets['FORK_PAT_' + github.actor] }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./buildFiles/v${{ steps.extract_version.outputs.version }}/cli-top-windows_v${{ steps.extract_version.outputs.version }}.zip
          asset_name: cli-top-windows_v${{ steps.extract_version.outputs.version }}.zip
          asset_content_type: application/zip

      - name: Upload Windows Installer to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets['FORK_PAT_' + github.actor] }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./buildFiles/v${{ steps.extract_version.outputs.version }}/cli-top-windows-installer_v${{ steps.extract_version.outputs.version }}.exe
          asset_name: cli-top-windows-installer_v${{ steps.extract_version.outputs.version }}.exe
          asset_content_type: application/octet-stream

      - name: Upload MacOS Binary to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets['FORK_PAT_' + github.actor] }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./buildFiles/v${{ steps.extract_version.outputs.version }}/cli-top-macos_v${{ steps.extract_version.outputs.version }}.zip
          asset_name: cli-top-macos_v${{ steps.extract_version.outputs.version }}.zip
          asset_content_type: application/zip

      - name: Upload Android Binary to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets['FORK_PAT_' + github.actor] }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./buildFiles/v${{ steps.extract_version.outputs.version }}/cli-top-android_v${{ steps.extract_version.outputs.version }}.zip
          asset_name: cli-top-android_v${{ steps.extract_version.outputs.version }}.zip
          asset_content_type: application/zip
