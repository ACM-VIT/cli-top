name: Build and Deploy cli-top Binaries

on:
  push:
    branches: ["main", "release"]
  pull_request:
    branches: ["main", "release"]

env:
  TARGET_REPO: technical-director-acmvit/cli-top-website
  VERSION_DIR_PREFIX: v

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build Linux Binary
        run: |
          mkdir -p build/linux
          GOOS=linux GOARCH=amd64 go build -o ./build/linux/cli-top -v ./...
          chmod +x ./build/linux/cli-top

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-linux
          path: ./build/linux/cli-top

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build Windows Executable
        run: |
          mkdir build\windows
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o build\windows\cli-top.exe -v .\...

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-windows
          path: ./build/windows/cli-top.exe

  build-macos:
    name: Build MacOS Binary
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build MacOS Binary
        run: |
          mkdir -p build/macos
          GOOS=darwin GOARCH=amd64 go build -o ./build/macos/cli-top -v ./...
          chmod +x ./build/macos/cli-top

      - name: Upload MacOS Binary
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-macos
          path: ./build/macos/cli-top

  build-android:
    name: Build Android Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build Android Binary
        run: |
          mkdir -p build/android
          GOOS=linux GOARCH=arm64 go build -o ./build/android/cli-top -v ./...
          chmod +x ./build/android/cli-top

      - name: Upload Android Binary
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-android
          path: ./build/android/cli-top

  build-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: build-windows
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - name: Download Windows Executable
        uses: actions/download-artifact@v3
        with:
          name: cli-top-windows
          path: ./build/windows

      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Extract Version
        id: extract_version
        shell: powershell
        run: |
          $versionLine = Select-String -Path "debug/debug.go" -Pattern 'var Version string = "(.*)"'
          if ($versionLine -eq $null) {
            Write-Error "Version string not found in debug/debug.go"
            exit 1
          }
          $version = $versionLine.Matches[0].Groups[1].Value
          Write-Output "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set Up Inno Setup
        run: choco install innosetup --version 6.2.0.0 -y

      - name: Prepare Installer Script
        shell: powershell
        run: |
          $version = "${{ steps.extract_version.outputs.version }}"
          $installerTemplate = Get-Content "installer.iss" -Raw
          $installerContent = $installerTemplate -replace 'AppVersion=2\.5\.0', "AppVersion=$version"
          Set-Content "installer_temp.iss" $installerContent

      - name: Create Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_temp.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-windows-installer
          path: ./cli-top-installer.exe

  deploy:
    name: Deploy Binaries
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos, build-android, build-installer]
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v3
        with:
          repository: technical-director-acmvit/cli-top-website
          path: cli-top-website
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Version Directory
        run: |
          VERSION_DIR="${{ env.VERSION_DIR_PREFIX }}${{ needs.build-installer.outputs.version }}"
          mkdir -p cli-top-website/${VERSION_DIR}/linux
          mkdir -p cli-top-website/${VERSION_DIR}/windows
          mkdir -p cli-top-website/${VERSION_DIR}/macos
          mkdir -p cli-top-website/${VERSION_DIR}/android
          mkdir -p cli-top-website/${VERSION_DIR}/windows/installer

      - name: Download Linux Binary
        uses: actions/download-artifact@v3
        with:
          name: cli-top-linux
          path: ./cli-top-website/${{ env.VERSION_DIR_PREFIX }}${{ needs.build-installer.outputs.version }}/linux

      - name: Download Windows Executable
        uses: actions/download-artifact@v3
        with:
          name: cli-top-windows
          path: ./cli-top-website/${{ env.VERSION_DIR_PREFIX }}${{ needs.build-installer.outputs.version }}/windows

      - name: Download MacOS Binary
        uses: actions/download-artifact@v3
        with:
          name: cli-top-macos
          path: ./cli-top-website/${{ env.VERSION_DIR_PREFIX }}${{ needs.build-installer.outputs.version }}/macos

      - name: Download Android Binary
        uses: actions/download-artifact@v3
        with:
          name: cli-top-android
          path: ./cli-top-website/${{ env.VERSION_DIR_PREFIX }}${{ needs.build-installer.outputs.version }}/android

      - name: Download Windows Installer
        uses: actions/download-artifact@v3
        with:
          name: cli-top-windows-installer
          path: ./cli-top-website/${{ env.VERSION_DIR_PREFIX }}${{ needs.build-installer.outputs.version }}/windows/installer

      - name: Commit and Push Changes
        run: |
          cd cli-top-website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add binaries and installer for version v${{ needs.build-installer.outputs.version }}" || echo "No changes to commit"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add binaries and installer for version v${{ needs.build-installer.outputs.version }}"
          title: "Add binaries and installer for version v${{ needs.build-installer.outputs.version }}"
          body: "This PR adds the binaries and Windows installer for version v${{ needs.build-installer.outputs.version }}."
          base: main
          head: add-binaries-v${{ needs.build-installer.outputs.version }}
