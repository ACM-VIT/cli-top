name: Build and Deploy cli-top Binaries

on:
  push:
    branches: ["main", "release"]
  pull_request:
    branches: ["main", "release"]

env:
  TARGET_REPO: technical-director-acmvit/cli-top-website
  FORK_REPO: theg1239/cli-top-website
  VERSION_DIR_PREFIX: v

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: List Repository Files (Debugging)
        run: ls -R

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build Linux Binary
        run: |
          mkdir -p build/linux
          go build -o build/linux/cli-top .

      - name: Extract Version
        id: extract_version
        run: |
          VERSION=$(grep 'var Version string =' ./debug/debug.go | awk -F '"' '{print $2}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Zip Linux Binary
        run: zip cli-top-linux_v${{ steps.extract_version.outputs.version }}.zip build/linux/cli-top

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-linux
          path: cli-top-linux_v${{ steps.extract_version.outputs.version }}.zip

  build-windows:
    name: Build Windows Executable and Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: List Repository Files (Debugging)
        run: Get-ChildItem -Recurse

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build Windows Executable
        run: |
          mkdir build\windows
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o build\windows\cli-top.exe .

      - name: Install Inno Setup
        run: |
          Invoke-WebRequest -Uri https://jrsoftware.org/download.php/is.exe -OutFile is.exe
          Start-Process -FilePath is.exe -Args '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG="install.log"' -Wait
          Remove-Item is.exe -Force

      - name: Extract Version for Installer
        id: extract_version
        shell: pwsh
        run: |
          $line = Get-Content -Path './debug/debug.go' | Select-String -Pattern 'var Version string ='
          if ($line -match 'var Version string = "(.*)"') {
              $version = $matches[1]
              echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
              Write-Error "Version not found in debug.go"
              exit 1
          }

      - name: Create Inno Setup Script
        shell: pwsh
        run: |
          $installerScript = @"
          [Setup]
          AppName=CLI-TOP
          AppVersion=${{ steps.extract_version.outputs.version }}
          DefaultDirName={localappdata}\CLI-TOP
          DefaultGroupName=CLI-TOP
          OutputBaseFilename=cli-top-installer-${{ steps.extract_version.outputs.version }}
          Compression=lzma
          SolidCompression=yes
          PrivilegesRequired=lowest

          [Files]
          Source: "build/windows/cli-top.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Code]
          const
            HWND_BROADCAST_CUSTOM = $FFFF;
            WM_SETTINGCHANGE = $1A;

          function SendMessageTimeoutA(hwnd: LongWord; msg: LongWord; wParam: LongWord;
                                      lParam: PAnsiChar; flags: LongWord;
                                      uTimeout: LongWord; var lpdwResult: LongWord): LongWord;
            external 'SendMessageTimeoutA@user32.dll stdcall';

          procedure RefreshEnvironment;
          var
            ResultValue: LongWord;
            EnvironmentStr: AnsiString;
          begin
            EnvironmentStr := 'Environment';

            if SendMessageTimeoutA(
                 HWND_BROADCAST_CUSTOM,
                 WM_SETTINGCHANGE,
                 0,
                 PAnsiChar(EnvironmentStr),
                 $2,
                 5000,
                 ResultValue
               ) = 0 then
            begin
              MsgBox('Failed to refresh environment variables.', mbError, MB_OK);
            end;
          end;

          procedure UpdatePath;
          var
            Path: string;
            RegKey: string;
          begin
            RegKey := 'Environment';

            if not RegQueryStringValue(HKCU, RegKey, 'Path', Path) then
              Path := '';

            if Pos(ExpandConstant('{app}'), Path) = 0 then
            begin
              if Path <> '' then
                Path := Path + ';';
              Path := Path + ExpandConstant('{app}');

              if not RegWriteStringValue(HKCU, RegKey, 'Path', Path) then
                MsgBox('Failed to update PATH variable.', mbError, MB_OK);
            end;

            RefreshEnvironment;
          end;

          procedure CurStepChanged(CurStep: TSetupStep);
          begin
            if CurStep = ssPostInstall then
            begin
              UpdatePath;
              MsgBox('CLI-TOP has been installed successfully. Please open a new Command Prompt window to use the CLI-TOP command.',
                     mbInformation, MB_OK);
            end;
          end;
          "@
          Set-Content -Path installer.iss -Value $installerScript -Encoding UTF8NoBOM

      - name: Show Inno Setup Script (Debugging)
        shell: pwsh
        run: |
          Write-Host "Generated installer.iss content:"
          Get-Content installer.iss

      - name: Compile Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Verify Installer Generation
        shell: pwsh
        run: |
          if (!(Test-Path -Path "./Output/cli-top-installer-${{ steps.extract_version.outputs.version }}.exe")) {
              Write-Error "Installer file not found: ./Output/cli-top-installer-${{ steps.extract_version.outputs.version }}.exe"
              exit 1
          }
          Write-Host "Installer file exists: ./Output/cli-top-installer-${{ steps.extract_version.outputs.version }}.exe"

      - name: Zip Windows Binary
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/cli-top.exe' -DestinationPath "cli-top-windows_v${{ steps.extract_version.outputs.version }}.zip"

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-windows
          path: cli-top-windows_v${{ steps.extract_version.outputs.version }}.zip

  build-macos:
    name: Build MacOS Binary
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: List Repository Files (Debugging)
        run: ls -R

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build MacOS Binary
        run: |
          mkdir -p build/macos
          GOOS=darwin GOARCH=amd64 go build -o build/macos/cli-top .
          chmod +x build/macos/cli-top

      - name: Extract Version
        id: extract_version
        run: |
          VERSION=$(grep 'var Version string =' ./debug/debug.go | awk -F '"' '{print $2}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Zip MacOS Binary
        run: zip cli-top-macos_v${{ steps.extract_version.outputs.version }}.zip build/macos/cli-top

      - name: Upload MacOS Binary
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-macos
          path: cli-top-macos_v${{ steps.extract_version.outputs.version }}.zip

  build-android:
    name: Build Android Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: List Repository Files (Debugging)
        run: ls -R

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build Android Binary
        run: |
          mkdir -p build/android
          GOOS=linux GOARCH=arm64 go build -o build/android/cli-top .
          chmod +x build/android/cli-top

      - name: Extract Version
        id: extract_version
        run: |
          VERSION=$(grep 'var Version string =' ./debug/debug.go | awk -F '"' '{print $2}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Zip Android Binary
        run: zip cli-top-android_v${{ steps.extract_version.outputs.version }}.zip build/android/cli-top

      - name: Upload Android Binary
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-android
          path: cli-top-android_v${{ steps.extract_version.outputs.version }}.zip

  deploy:
    name: Deploy Binaries
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos, build-android]
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v3
        with:
          repository: ${{ env.FORK_REPO }}
          token: ${{ secrets.FORK_PAT }}
          path: target-repo

      - name: Debug Repository Directory
        run: |
          echo "Contents of the target-repo directory:"
          ls -la target-repo
          if [ ! -d "target-repo/.git" ]; then
            echo "No Git repository detected in target-repo. Initializing..."
            cd target-repo
            git init
            git remote add origin https://github.com/${{ env.FORK_REPO }}.git
            git fetch origin
            git checkout -b main || git checkout -b default_branch
          fi

      - name: Verify Git Configuration
        run: |
          cd target-repo
          git remote -v
          git branch

      - name: Extract Version from Build
        id: extract_version
        run: |
          echo "version=${{ needs.build-linux.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Create Version Directory
        run: |
          VERSION_DIR="${{ env.VERSION_DIR_PREFIX }}${{ steps.extract_version.outputs.version }}"
          mkdir -p "target-repo/${VERSION_DIR}"

      - name: Download Linux Artifact
        uses: actions/download-artifact@v3
        with:
          name: cli-top-linux
          path: ./artifacts

      - name: Download Windows Artifact
        uses: actions/download-artifact@v3
        with:
          name: cli-top-windows
          path: ./artifacts

      - name: Download MacOS Artifact
        uses: actions/download-artifact@v3
        with:
          name: cli-top-macos
          path: ./artifacts

      - name: Download Android Artifact
        uses: actions/download-artifact@v3
        with:
          name: cli-top-android
          path: ./artifacts

      - name: Move Artifacts to Fork Repository
        run: |
          VERSION_DIR="${{ env.VERSION_DIR_PREFIX }}${{ steps.extract_version.outputs.version }}"
          mv artifacts/cli-top-linux_v${{ steps.extract_version.outputs.version }}.zip "target-repo/${VERSION_DIR}/"
          mv artifacts/cli-top-windows_v${{ steps.extract_version.outputs.version }}.zip "target-repo/${VERSION_DIR}/"
          mv artifacts/cli-top-macos_v${{ steps.extract_version.outputs.version }}.zip "target-repo/${VERSION_DIR}/"
          mv artifacts/cli-top-android_v${{ steps.extract_version.outputs.version }}.zip "target-repo/${VERSION_DIR}/"

      - name: Update latest.json
        run: |
          cd target-repo
          if [ -f "latest.json" ]; then
            jq --arg v "${{ steps.extract_version.outputs.version }}" '.version = $v' latest.json > tmp.json && mv tmp.json latest.json
          else
            echo "latest.json not found!"
            exit 1
          fi

      - name: Define Branch Name
        id: define_branch
        run: echo "branch=add-binaries-v${{ steps.extract_version.outputs.version }}-${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Debug Branch Name
        run: echo "Generated branch name: ${{ steps.define_branch.outputs.branch }}"

      - name: Commit and Push Changes to Fork
        run: |
          cd target-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ${{ steps.define_branch.outputs.branch }}
          git add .
          git commit -m "feat:v${{ steps.extract_version.outputs.version }} release" || echo "No changes to commit"
          git push origin ${{ steps.define_branch.outputs.branch }}

      - name: Create Pull Request from Fork to Target
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.FORK_PAT }}
          branch: ${{ steps.define_branch.outputs.branch }}
          commit-message: "feat:v${{ steps.extract_version.outputs.version }} release"
          title: "feat:v${{ steps.extract_version.outputs.version }} release"
          body: |
            This PR adds the binaries and updates the latest.json file for version v${{ steps.extract_version.outputs.version }}.

            cli-top-android_v${{ steps.extract_version.outputs.version }}.zip
            feat:v${{ steps.extract_version.outputs.version }} release
            last month

            cli-top-linux_v${{ steps.extract_version.outputs.version }}.zip
            feat:v${{ steps.extract_version.outputs.version }} release
            last month

            cli-top-macos_v${{ steps.extract_version.outputs.version }}.zip
            feat:v${{ steps.extract_version.outputs.version }} release
            last month

            cli-top-windows_v${{ steps.extract_version.outputs.version }}.zip

