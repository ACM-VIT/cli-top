name: Build and Deploy cli-top Binaries

on:
  push:
    branches: ["main", "release"]
  pull_request:
    branches: ["main", "release"]

env:
  TARGET_REPO: technical-director-acmvit/cli-top-website       # Original target repository
  FORK_REPO: theg1239/cli-top-website                        # Your forked repository
  VERSION_DIR_PREFIX: v

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: List Repository Files (Debugging)
        run: ls -R

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build Linux Binary
        run: |
          mkdir -p build/linux
          go build -o build/linux/cli-top .

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-linux
          path: ./build/linux/cli-top

      - name: Extract Version
        id: extract_version
        run: |
          VERSION=$(grep 'var Version string =' ./debug/debug.go | awk -F '"' '{print $2}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  build-windows:
    name: Build Windows Executable and Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: List Repository Files (Debugging)
        run: Get-ChildItem -Recurse

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build Windows Executable
        run: |
          mkdir build\windows
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o build\windows\cli-top.exe .

      - name: Install Inno Setup
        run: |
          Invoke-WebRequest -Uri https://jrsoftware.org/download.php/is.exe -OutFile is.exe
          Start-Process -FilePath is.exe -Args '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG="install.log"' -Wait
          Remove-Item is.exe -Force

      - name: Extract Version for Installer
        id: extract_version
        shell: pwsh
        run: |
          # Read the specific line containing the version
          $line = Get-Content -Path './debug/debug.go' | Select-String -Pattern 'var Version string ='
          if ($line -match 'var Version string = "(.*)"') {
              $version = $matches[1]
              echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          else {
              Write-Error "Version not found in debug.go"
              exit 1
          }

      - name: Create Inno Setup Script
        run: |
          $installerScript = @'
          [Setup]
          AppName=CLI-TOP
          AppVersion=${{ steps.extract_version.outputs.version }}
          DefaultDirName={localappdata}\CLI-TOP
          DefaultGroupName=CLI-TOP
          OutputBaseFilename=cli-top-installer-${{ steps.extract_version.outputs.version }}
          Compression=lzma
          SolidCompression=yes
          PrivilegesRequired=lowest

          [Files]
          Source: "build/windows/cli-top.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Code]
          const
            HWND_BROADCAST_CUSTOM = $FFFF; 
            WM_SETTINGCHANGE = $1A;

          function SendMessageTimeoutA(hwnd: LongWord; msg: LongWord; wParam: LongWord;
                                      lParam: PAnsiChar; flags: LongWord;
                                      uTimeout: LongWord; var lpdwResult: LongWord): LongWord;
            external 'SendMessageTimeoutA@user32.dll stdcall';

          procedure RefreshEnvironment;
          var
            ResultValue: LongWord;
            EnvironmentStr: AnsiString; 
          begin
            EnvironmentStr := 'Environment';

            if SendMessageTimeoutA(
                 HWND_BROADCAST_CUSTOM,  
                 WM_SETTINGCHANGE,       
                 0,                      
                 PAnsiChar(EnvironmentStr), 
                 $2,                  
                 5000,                   
                 ResultValue             
               ) = 0 then
            begin
              MsgBox('Failed to refresh environment variables.', mbError, MB_OK);
            end;
          end;

          procedure UpdatePath;
          var
            Path: string;
            RegKey: string;
          begin
            RegKey := 'Environment';
            
            if not RegQueryStringValue(HKCU, RegKey, 'Path', Path) then
              Path := '';

            if Pos(ExpandConstant('{app}'), Path) = 0 then
            begin
              if Path <> '' then
                Path := Path + ';';
              Path := Path + ExpandConstant('{app}');
              
              if not RegWriteStringValue(HKCU, RegKey, 'Path', Path) then
                MsgBox('Failed to update PATH variable.', mbError, MB_OK);
            end;

            RefreshEnvironment;
          end;

          procedure CurStepChanged(CurStep: TSetupStep);
          begin
            if CurStep = ssPostInstall then
            begin
              UpdatePath;
              MsgBox('CLI-TOP has been installed successfully. Please open a new Command Prompt window to use the CLI-TOP command.', 
                     mbInformation, MB_OK);
            end;
          end;
          '@

          # Ensure no BOM is added by using UTF8NoBOM encoding
          Set-Content -Path installer.iss -Value $installerScript -Encoding UTF8NoBOM

      - name: Show Inno Setup Script (Debugging)
        shell: pwsh
        run: |
          Write-Host "Generated installer.iss content:"
          Get-Content installer.iss

      - name: Compile Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Verify Installer Generation
        shell: pwsh
        run: |
          if (!(Test-Path -Path "./Output/cli-top-installer-${{ steps.extract_version.outputs.version }}.exe")) {
              Write-Error "Installer file not found: ./Output/cli-top-installer-${{ steps.extract_version.outputs.version }}.exe"
              exit 1
          }
          Write-Host "Installer file exists: ./Output/cli-top-installer-${{ steps.extract_version.outputs.version }}.exe"

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-windows
          path: ./build/windows/cli-top.exe

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-windows-installer
          path: ./Output/cli-top-installer-${{ steps.extract_version.outputs.version }}.exe

  build-macos:
    name: Build MacOS Binary
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: List Repository Files (Debugging)
        run: ls -R

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build MacOS Binary
        run: |
          mkdir -p build/macos
          GOOS=darwin GOARCH=amd64 go build -o build/macos/cli-top .
          chmod +x build/macos/cli-top

      - name: Upload MacOS Binary
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-macos
          path: ./build/macos/cli-top

  build-android:
    name: Build Android Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: List Repository Files (Debugging)
        run: ls -R

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build Android Binary
        run: |
          mkdir -p build/android
          GOOS=linux GOARCH=arm64 go build -o build/android/cli-top .
          chmod +x build/android/cli-top

      - name: Upload Android Binary
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-android
          path: ./build/android/cli-top

  deploy:
    name: Deploy Binaries
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos, build-android]
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v3
        with:
          repository: ${{ env.FORK_REPO }}
          token: ${{ secrets.FORK_PAT }}    # Use the PAT for your fork
          path: target-repo

      - name: Verify Fork Repository Checkout
        run: ls -R target-repo

      - name: Extract Version from Build
        id: extract_version
        run: |
          echo "version=${{ needs.build-linux.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Create Version Directory
        run: |
          VERSION_DIR="${{ env.VERSION_DIR_PREFIX }}${{ steps.extract_version.outputs.version }}"
          mkdir -p "target-repo/${VERSION_DIR}/linux"
          mkdir -p "target-repo/${VERSION_DIR}/windows"
          mkdir -p "target-repo/${VERSION_DIR}/macos"
          mkdir -p "target-repo/${VERSION_DIR}/android"

      - name: Download Linux Binary
        uses: actions/download-artifact@v3
        with:
          name: cli-top-linux
          path: ./linux

      - name: Download Windows Executable
        uses: actions/download-artifact@v3
        with:
          name: cli-top-windows
          path: ./windows

      - name: Download Windows Installer
        uses: actions/download-artifact@v3
        with:
          name: cli-top-windows-installer
          path: ./windows

      - name: Download MacOS Binary
        uses: actions/download-artifact@v3
        with:
          name: cli-top-macos
          path: ./macos

      - name: Download Android Binary
        uses: actions/download-artifact@v3
        with:
          name: cli-top-android
          path: ./android

      - name: List Downloaded Artifacts (Debugging)
        run: |
          echo "Linux Binary:"
          ls -R ./linux
          echo "Windows Executable:"
          ls -R ./windows
          echo "Windows Installer:"
          ls -R ./windows
          echo "MacOS Binary:"
          ls -R ./macos
          echo "Android Binary:"
          ls -R ./android

      - name: Move Artifacts to Fork Repository
        run: |
          VERSION_DIR="${{ env.VERSION_DIR_PREFIX }}${{ steps.extract_version.outputs.version }}"
          mv linux/cli-top "target-repo/${VERSION_DIR}/linux/"
          mv windows/cli-top.exe "target-repo/${VERSION_DIR}/windows/"
          mv windows/cli-top-installer-${{ steps.extract_version.outputs.version }}.exe "target-repo/${VERSION_DIR}/windows/"
          mv macos/cli-top "target-repo/${VERSION_DIR}/macos/"
          mv android/cli-top "target-repo/${VERSION_DIR}/android/"

      - name: Update latest.json
        run: |
          cd target-repo
          # Ensure jq is installed
          sudo apt-get update
          sudo apt-get install -y jq
          
          # Path to latest.json
          LATEST_JSON="latest.json"
          
          # Check if latest.json exists
          if [ -f "$LATEST_JSON" ]; then
            # Update the version field
            jq --arg v "${{ steps.extract_version.outputs.version }}" '.version = $v' "$LATEST_JSON" > tmp.json && mv tmp.json "$LATEST_JSON"
          else
            echo "latest.json not found!"
            exit 1
          fi

      - name: Define Branch Name
        id: define_branch
        run: echo "branch=add-binaries-v${{ steps.extract_version.outputs.version }}-${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Commit and Push Changes to Fork
        run: |
          cd target-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ${{ steps.define_branch.outputs.branch }}
          git add .
          git commit -m "Add binaries and update latest.json for version v${{ steps.extract_version.outputs.version }}" || echo "No changes to commit"
          git push origin ${{ steps.define_branch.outputs.branch }}

      - name: Create Pull Request from Fork to Target
        uses: peter-evans/create-pull-request@v11
        with:
          token: ${{ secrets.FORK_PAT }}
          repository: ${{ env.TARGET_REPO }}
          base: main
          head: theg1239:${{ steps.define_branch.outputs.branch }}
          title: "Add binaries and update latest.json for version v${{ steps.extract_version.outputs.version }}"
          body: "This PR adds the binaries, Windows installer, and updates the latest.json file for version v${{ steps.extract_version.outputs.version }}."
