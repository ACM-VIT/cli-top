name: Build and Deploy cli-top Binaries

on:
  push:
    branches: ["main", "release"]
  pull_request:
    branches: ["main", "release"]

env:
  TARGET_REPO: technical-director-acmvit/cli-top-website
  VERSION_DIR_PREFIX: v

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: List Repository Files (Debugging)
        run: ls -R

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build Linux Binary
        run: |
          mkdir -p build/linux
          go build -o build/linux/cli-top .

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-linux
          path: ./build/linux/cli-top

      - name: Extract Version
        id: extract_version
        run: |
          VERSION=$(grep 'var Version string =' ./debug/debug.go | awk -F '"' '{print $2}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: List Repository Files (Debugging)
        run: Get-ChildItem -Recurse

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build Windows Executable
        run: |
          mkdir build\windows
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o build\windows\cli-top.exe .

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-windows
          path: ./build/windows/cli-top.exe

  build-macos:
    name: Build MacOS Binary
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: List Repository Files (Debugging)
        run: ls -R

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build MacOS Binary
        run: |
          mkdir -p build/macos
          GOOS=darwin GOARCH=amd64 go build -o build/macos/cli-top .
          chmod +x build/macos/cli-top

      - name: Upload MacOS Binary
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-macos
          path: ./build/macos/cli-top

  build-android:
    name: Build Android Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: List Repository Files (Debugging)
        run: ls -R

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          go mod tidy
          go get .

      - name: Build Android Binary
        run: |
          mkdir -p build/android
          GOOS=linux GOARCH=arm64 go build -o build/android/cli-top .
          chmod +x build/android/cli-top

      - name: Upload Android Binary
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-android
          path: ./build/android/cli-top

  deploy:
    name: Deploy Binaries
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos, build-android]
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v3
        with:
          repository: technical-director-acmvit/cli-top-website
          path: cli-top-website
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Target Repository Checkout
        run: ls -R cli-top-website

      - name: Extract Version from Build
        id: extract_version
        run: |
          echo "version=${{ needs.build-linux.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Create Version Directory
        run: |
          VERSION_DIR="${{ env.VERSION_DIR_PREFIX }}${{ steps.extract_version.outputs.version }}"
          mkdir -p cli-top-website/${VERSION_DIR}/linux
          mkdir -p cli-top-website/${VERSION_DIR}/windows
          mkdir -p cli-top-website/${VERSION_DIR}/macos
          mkdir -p cli-top-website/${VERSION_DIR}/android

      - name: Download Linux Binary
        uses: actions/download-artifact@v3
        with:
          name: cli-top-linux
          path: ./cli-top-website/${{ env.VERSION_DIR_PREFIX }}${{ steps.extract_version.outputs.version }}/linux

      - name: Download Windows Executable
        uses: actions/download-artifact@v3
        with:
          name: cli-top-windows
          path: ./cli-top-website/${{ env.VERSION_DIR_PREFIX }}${{ steps.extract_version.outputs.version }}/windows

      - name: Download MacOS Binary
        uses: actions/download-artifact@v3
        with:
          name: cli-top-macos
          path: ./cli-top-website/${{ env.VERSION_DIR_PREFIX }}${{ steps.extract_version.outputs.version }}/macos

      - name: Download Android Binary
        uses: actions/download-artifact@v3
        with:
          name: cli-top-android
          path: ./cli-top-website/${{ env.VERSION_DIR_PREFIX }}${{ steps.extract_version.outputs.version }}/android

      - name: Commit and Push Changes
        run: |
          cd cli-top-website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add binaries for version v${{ steps.extract_version.outputs.version }}" || echo "No changes to commit"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add binaries for version v${{ steps.extract_version.outputs.version }}"
          title: "Add binaries for version v${{ steps.extract_version.outputs.version }}"
          body: "This PR adds the binaries for version v${{ steps.extract_version.outputs.version }}."
          base: main
          branch: "add-binaries-v${{ steps.extract_version.outputs.version }}"
        working-directory: cli-top-website
