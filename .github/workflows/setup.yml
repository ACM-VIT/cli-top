name: Build and Deploy cli-top Binaries

on:
  push:
    branches: ["main", "release"]
  pull_request:
    branches: ["main", "release"]

env:
  TARGET_REPO: technical-director-acmvit/cli-top-website
  VERSION_DIR_PREFIX: v

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: List Repository Files (Debugging)
        run: |
          ls -R

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          cd cli-top
          go mod tidy
          go get .

      - name: Build Linux Binary
        run: |
          mkdir -p ../build/linux
          cd cli-top
          GOOS=linux GOARCH=amd64 go build -o ../build/linux/cli-top .
          chmod +x ../build/linux/cli-top

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-linux
          path: ./build/linux/cli-top

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: List Repository Files (Debugging)
        run: |
          dir /S

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          cd cli-top
          go mod tidy
          go get .

      - name: Build Windows Executable
        run: |
          mkdir build\windows
          cd cli-top
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o ../build/windows/cli-top.exe .

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-windows
          path: ./build/windows/cli-top.exe

  build-macos:
    name: Build MacOS Binary
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: List Repository Files (Debugging)
        run: |
          ls -R

      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Dependencies
        run: |
          cd cli-top
          go mod tidy
          go get .

      - name: Build MacOS Binary
        run: |
          mkdir -p ../build/macos
          cd cli-top
          GOOS=darwin GOARCH=amd64 go build -o ../build/macos/cli-top .
          chmod +x ../build/macos/cli-top

      - name: Upload MacOS Binary
        uses: actions/upload-artifact@v3
        with:
          name: cli-top-macos
          path: ./build/macos/cli-top

  build-android:
    name: Build Andr
